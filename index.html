    function HoverBorderGradient({ children, className = "", containerClassName = "", onClick, ...props }) {
      const [hovered, setHovered] = useState(false);
      const [direction, setDirection] = useState('BOTTOM');

      const directions = ['TOP', 'LEFT', 'BOTTOM', 'RIGHT'];

      const movingMap = {
        TOP: 'radial-gradient(20.7% 50% at 50% 0%, #FDC100 0%, rgba(253, 193, 0, 0) 100%)',
        LEFT: 'radial-gradient(16.6% 43.1% at 0% 50%, #78B719 0%, rgba(120, 183, 25, 0) 100%)',
        BOTTOM: 'radial-gradient(20.7% 50% at 50% 100%, #10B981 0%, rgba(16, 185, 129, 0) 100%)',
        RIGHT: 'radial-gradient(16.2% 41.2% at 100% 50%, #FDC100 0%, rgba(253, 193, 0, 0) 100%)',
      };

      const highlight = 'radial-gradient(75% 180% at 50% 50%, #78B719 0%, rgba(253, 193, 0, 0) 100%)';

      useEffect(() => {
        if (!hovered) {
          const interval = setInterval(() => {
            setDirection((prev) => {
              const idx = directions.indexOf(prev);
              return directions[(idx + 1) % directions.length];
            });
          }, 1200);
          return () => clearInterval(interval);
        }
      }, [hovered]);

      return (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          onClick={onClick}
          className={`relative flex h-min w-fit flex-col items-center justify-center overflow-visible rounded-full border border-white/20 bg-[#084234]/60 p-px backdrop-blur-md transition duration-500 cursor-pointer ${containerClassName}`}
          {...props}
        >
          <div className={`z-10 w-auto rounded-[inherit] px-5 py-2.5 text-white ${className}`}>
            {children}
          </div>
          <motion.div
            className="absolute inset-0 z-0 flex-none overflow-hidden rounded-[inherit]"
            style={{
              filter: 'blur(3px)',
              position: 'absolute',
              width: '100%',
              height: '100%',
            }}
            initial={{ background: movingMap[direction] }}
            animate={{
              background: hovered ? [movingMap[direction], highlight] : movingMap[direction],
            }}
            transition={{ ease: 'linear', duration: 0.8 }}
          />
          <div className="absolute inset-0.5 z-1 flex-none rounded-[100px] bg-[#041F18]/80" />
        </div>
      );
    }

    function WordRotate({ words, duration = 2200 }) {
      const [index, setIndex] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setIndex((prevIndex) => (prevIndex + 1) % words.length);
        }, duration);
        return () => clearInterval(interval);
      }, [words, duration]);

      return (
        <span className="inline-block overflow-hidden py-1 align-bottom">
          <AnimatePresence mode="wait">
            <motion.span
              key={words[index]}
              initial={{ opacity: 0, y: -20 }}
              animate={{ opacity: 1, y: 0 }}
              exit={{ opacity: 0, y: 20 }}
              transition={{ duration: 0.3 }}
              className="inline-block text-[#FDC100] underline decoration-[#78B719] decoration-4 underline-offset-8"
            >
              {words[index]}
            </motion.span>
          </AnimatePresence>
        </span>
      );
    }
